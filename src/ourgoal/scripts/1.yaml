# 避障参数

  max_vel_x: 0.3 #0.55
#   max_vel_x_backwards: 0 #1.6
  max_vel_y: 0.15 #1.6
  max_vel_theta: 0.7
  acc_lim_x: 0.18
  acc_lim_y: 0.10
  acc_lim_theta: 0.5
  
  
  yaw_goal_tolerance: 0.15
  xy_goal_tolerance: 0.15

  weight_max_vel_x: 5            #最大x速度权重 0~2
  weight_max_vel_y: 10
  weight_max_vel_theta: 50        #最大角速度权重 0~1
  weight_acc_lim_x: 10           #最大x 加速度权重 0~1
  weight_acc_lim_y: 10           #最大y 加速度权重
  weight_acc_lim_theta: 30        #最大角速度权重 0~1
  weight_kinematics_nh: 300      #非完整运动学的优化权重
  weight_kinematics_forward_drive: 1000     #优化过程中，迫使机器人只选择前进方向，差速轮适用
  weight_kinematics_turning_radius: 10    #优化过程中，车型机器人的最小转弯半径的权重
  weight_optimaltime: 25 # must be > 0  #优化过程中，基于轨迹的时间上的权重
  # weight_shortest_path: 0
  weight_obstacle: 500         #优化过程中，和障碍物最小距离的权重 0~50
  weight_inflation: 0.3         #优化过程中， 膨胀区的权重
  weight_dynamic_obstacle: 500    #优化过程中，和动态障碍物最小距离的权重
  weight_dynamic_obstacle_inflation: 0.3  #优化过程中，和动态障碍物膨胀区的权重 0~50
  weight_viapoint: 150             #优化过程中，和全局路径采样点距离的权重
  weight_adapt_factor: 2